# OpenCue - Production compose stack (Shared by Portainer and Docker Compose)
#
# Differences from root docker-compose.yml:
#   1. Omits build: directives; uses image: only. Portainer stacks lack build contexts.
#      To build locally on host, overlay build.yml from the same directory.
#   2. Omits rqd: Docker host does not render; render nodes are external Windows hosts.
#   3. PostgreSQL port is not published: Host runs other services; avoids port clashes & exposure.
#   4. All configurable parameters driven via environment variables; no changes to this file needed.
#   5. Explicitly named network to isolate from other host stacks.
#   6. Resource limits defined to protect co-located services.
#
# Deployment Routes (See notes/deploy/01-server.md):
#   A. Portainer: Images pulled from registry; configure via Portainer environment variables.
#   B. Docker Compose: Run on Docker host:
#        docker compose --env-file .env -f opencue.portainer.yml -f build.yml up -d --build
#
# Environment variables detailed in env.example. Variables with :? are mandatory.

services:
  db:
    image: postgres:15.1
    container_name: opencue-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cuebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mandatory setting}
      POSTGRES_DB: ${POSTGRES_DB:-cuebot}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - opencue
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cuebot} -d ${POSTGRES_DB:-cuebot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  flyway:
    image: ${OPENCUE_FLYWAY_IMAGE:?mandatory setting}
    container_name: opencue-flyway
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-cuebot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?mandatory setting}
      PGDATABASE: ${POSTGRES_DB:-cuebot}
      PGHOST: db
      PGPORT: 5432
    command: /opt/scripts/migrate.sh
    networks:
      - opencue
    restart: "no"

  cuebot:
    image: ${OPENCUE_CUEBOT_IMAGE:?mandatory setting}
    container_name: opencue-cuebot
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    ports:
      - "${CUEBOT_GRPC_PORT:-8443}:8443"
    environment:
      # Note: This is the frame log "root directory". Directory creation and file writes
      # are handled by RQD on render nodes, not Cuebot. Cuebot neither mounts nor writes here.
      # Must point to a shared location writable by all render nodes.
      # For Windows render nodes, use forward-slash UNC syntax or uniform drive letters.
      CUE_FRAME_LOG_DIR: ${CUE_FRAME_LOG_DIR:?mandatory setting}
    command: >-
      --datasource.cue-data-source.jdbc-url=jdbc:postgresql://db/${POSTGRES_DB:-cuebot}
      --datasource.cue-data-source.username=${POSTGRES_USER:-cuebot}
      --datasource.cue-data-source.password=${POSTGRES_PASSWORD:?mandatory setting}
      --log.frame-log-root.Windows=${FRAME_LOG_ROOT_WINDOWS:-${CUE_FRAME_LOG_DIR}}
      --log.frame-log-root.debian=${FRAME_LOG_ROOT_LINUX:-${CUE_FRAME_LOG_DIR}}
      --metrics.prometheus.collector=${CUEBOT_METRICS_COLLECTOR:-false}
    # [Monitoring] /metrics (port 8080, internal container network only) exposes basic metrics
    # (frames, jobs, host reports). CUEBOT_METRICS_COLLECTOR=true enables queue health metrics;
    # upstream Grafana dashboards depend on these metrics. See monitoring.portainer.yml.
    #
    # [Node Name Resolution] Cuebot strips reported hostnames to their first token before
    # calling back on port 8444; that short name must resolve inside the Cuebot container.
    #
    # Production resolution relies on DNS: containers inherit host /etc/resolv.conf search domains.
    # If host resolves RENDER01, containers do as well, requiring no extra setup here.
    # If host resolution fails, overlay dns / dns_search via site.example.yml.
    # Note: Do not write dns_search: ${DNS_SEARCH:-} here; empty string clears inherited domains.
    #
    # Fallback placeholder below for single-node tests without DNS:
    extra_hosts:
      - "${RENDER_NODE_NAME:-opencue-placeholder}:${RENDER_NODE_ADDR:-127.0.0.1}"
    networks:
      - opencue
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || [ $$? -eq 22 ]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G

  # ---------------------------------------------------------------------------
  # REST Gateway: Bridges Cuebot gRPC to HTTP/JSON for CueWeb.
  # Not published to host: only consumed by CueWeb within the internal network.
  # To expose REST API directly to pipeline, publish ports behind a reverse proxy.
  # ---------------------------------------------------------------------------
  rest-gateway:
    image: ${OPENCUE_REST_GATEWAY_IMAGE:?mandatory setting}
    container_name: opencue-rest-gateway
    depends_on:
      cuebot:
        condition: service_healthy
    environment:
      CUEBOT_ENDPOINT: cuebot:8443
      JWT_SECRET: ${JWT_SECRET:?mandatory setting}
      REST_PORT: 8448
      LOG_LEVEL: info
    networks:
      - opencue
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8448/ || [ $$? -eq 22 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # CueWeb: Web monitoring interface.
  #
  # Regarding NEXT_PUBLIC_* variables: Baked into image during build time.
  # Upstream configuration leaves NEXT_PUBLIC_URL blank, meaning the browser uses
  # same-origin relative URLs hitting /api on CueWeb, forwarded server-side
  # to rest-gateway:8448. The container name rest-gateway is only evaluated
  # server-side; browsers never resolve it, allowing flexible deployment origins.
  # ---------------------------------------------------------------------------
  cueweb:
    image: ${OPENCUE_CUEWEB_IMAGE:?mandatory setting}
    container_name: opencue-cueweb
    depends_on:
      rest-gateway:
        condition: service_healthy
    ports:
      - "${CUEWEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_OPENCUE_ENDPOINT: http://rest-gateway:8448
      NEXT_PUBLIC_URL: ""
      NEXT_PUBLIC_AUTH_PROVIDER: ""
      NEXT_JWT_SECRET: ${JWT_SECRET:?mandatory setting}
      NEXTAUTH_URL: ${CUEWEB_PUBLIC_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${CUEWEB_NEXTAUTH_SECRET:?mandatory setting}
      SENTRY_ENVIRONMENT: production
      # Two whitelists serve distinct endpoints; do not conflate:
      #
      # CUEWEB_LOG_ROOTS    -> /api/getlog and stuck-frames/lastline
      #                        Reads plain text frame logs (.rqlog)
      #                        Defaults to unrestricted absolute container paths if unset;
      #                        restrict for security hardening.
      #
      # CUEWEB_PREVIEW_ROOTS -> /api/frame/preview
      #                        Renders thumbnail image previews of output renders
      #                        Rejects all requests (403) if unset (fail-closed)
      #                        Must point to render output share, not log share.
      #
      # Note: Upstream sandbox sets PREVIEW_ROOTS to log dir because its Blender demo
      #       writes frames into logs. Production environments separate these shares.
      CUEWEB_LOG_ROOTS: ${CUEWEB_LOG_ROOTS:-/mnt/logs}
      CUEWEB_PREVIEW_ROOTS: ${CUEWEB_PREVIEW_ROOTS:-}
    volumes:
      # CueWeb requires filesystem access to frame logs.
      # Note: Paths stored by Cuebot reflect paths written by render nodes.
      # On Windows render nodes, these are Windows paths nonexistent in Linux containers.
      # See notes/sandbox/13.
      # Mounts empty volume if unset; CueWeb starts normally without log viewing.
      - ${FRAME_LOG_MOUNT_SOURCE:-cueweb-empty}:${FRAME_LOG_MOUNT_TARGET:-/mnt/logs}:ro
      # Render outputs for thumbnail previews. Mounts empty volume if unset.
      - ${RENDER_OUT_MOUNT_SOURCE:-cueweb-empty}:${RENDER_OUT_MOUNT_TARGET:-/mnt/render}:ro
    networks:
      - opencue
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Post-deployment initialization: Bootstraps show, subscription, and service.
  # Runs to completion; idempotent. Skips execution if OPENCUE_INIT_* are unset.
  # Shows require subscriptions to receive dispatched work.
  # ---------------------------------------------------------------------------
  init:
    image: ${OPENCUE_INIT_IMAGE:?mandatory setting}
    container_name: opencue-init
    depends_on:
      cuebot:
        condition: service_healthy
    environment:
      CUEBOT_HOSTS: cuebot:8443
      OPENCUE_INIT_SHOWS: ${OPENCUE_INIT_SHOWS:-}
      OPENCUE_INIT_ALLOCS: ${OPENCUE_INIT_ALLOCS:-local.general,local.desktop,cloud.general}
      OPENCUE_INIT_SUB_CORES: ${OPENCUE_INIT_SUB_CORES:-1000}
      OPENCUE_INIT_SERVICES: ${OPENCUE_INIT_SERVICES:-}
    networks:
      - opencue
    restart: "no"

networks:
  opencue:
    name: opencue

volumes:
  db-data:
    name: opencue-db-data
  cueweb-empty:
    name: opencue-cueweb-empty
