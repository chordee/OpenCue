# Compose override for building images locally on top of opencue.portainer.yml.
#
# Paths resolve relative to the directory of the first -f file (../../.. is repo root).
# Image names inherit OPENCUE_*_IMAGE from the main file, so builds tagged properly:
#
#   Route B: Docker Compose (Build on host directly and launch)
#        docker compose --env-file .env -f opencue.portainer.yml -f build.yml up -d --build
#
#   Route A: Portainer (Build on dev machine, push to registry, pull via Portainer)
#        docker compose --env-file .env -f opencue.portainer.yml -f build.yml build
#        docker compose --env-file .env -f opencue.portainer.yml -f build.yml \
#          push flyway cuebot rest-gateway cueweb init
#      (Must list services explicitly during push to avoid attempting to push postgres:15.1)

services:
  flyway:
    build:
      context: ../../..
      dockerfile: notes/deploy/server/flyway.Dockerfile

  cuebot:
    build:
      context: ../../..
      dockerfile: cuebot/Dockerfile

  rest-gateway:
    build:
      context: ../../..
      dockerfile: rest_gateway/Dockerfile

  cueweb:
    build:
      context: ../../../cueweb
      dockerfile: Dockerfile
      additional_contexts:
        project_root: ../../..
      args:
        # NEXT_PUBLIC_* variables are baked into image; rebuilding required if changed.
        # Leave NEXT_PUBLIC_URL blank: browser uses same-origin relative URLs.
        - NEXT_PUBLIC_OPENCUE_ENDPOINT=http://rest-gateway:8448
        - NEXT_PUBLIC_URL=
        - NEXT_PUBLIC_AUTH_PROVIDER=
        - NEXT_PUBLIC_LOG_EDITOR_URL=
        - NEXT_PUBLIC_CUEPROGBAR_URL=
        - NEXT_PUBLIC_PREVIEW_URL=

  init:
    build:
      context: ../../..
      dockerfile: notes/deploy/server/init/Dockerfile
      args:
        - OPENCUE_VERSION=${OPENCUE_VERSION:-0.0.0}
