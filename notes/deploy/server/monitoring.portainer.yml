# OpenCue Monitoring Stack (Optional) - Standalone stack: Prometheus + Grafana + PostgreSQL exporter
#
# Prerequisite: opencue stack must be running (this stack joins its opencue network).
# Configuration uses compose inline configs; compatible with Portainer Web editor and
# Repository mode without host bind mounts (verified).
#
# Post-deployment:
#   - Grafana: http://<server-ip>:3001, default user: admin
#   - Dashboards: In Grafana -> Dashboards -> Import, import:
#       sandbox/config/grafana/dashboards/PostgreSQL.json
#       sandbox/config/grafana/dashboards/cuebot.json
#     Cuebot dashboard requires CUEBOT_METRICS_COLLECTOR=true in opencue stack; otherwise blank.
#
# Documentation: notes/deploy/04-operations.md.

services:
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: opencue-prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - prometheus-data:/prometheus
    # Do not publish port: Prometheus lacks authentication; accessible only by Grafana within network
    networks: [opencue]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: opencue-db-exporter
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-cuebot}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-cuebot}
      # Matches POSTGRES_PASSWORD in opencue stack
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?mandatory setting}
    networks: [opencue]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  grafana:
    image: grafana/grafana:12.3.5
    container_name: opencue-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?mandatory setting}
      GF_USERS_ALLOW_SIGN_UP: "false"
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks: [opencue]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 30s
      scrape_configs:
        - job_name: cuebot
          metrics_path: /metrics
          static_configs: [{targets: ['cuebot:8080']}]
        - job_name: db
          static_configs: [{targets: ['db-exporter:9187']}]
  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        # Name must be prometheus as referenced by upstream dashboards
        - name: prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true

networks:
  opencue:
    external: true

volumes:
  prometheus-data:
    name: opencue-prometheus-data
  grafana-data:
    name: opencue-grafana-data
