# Internal Docker Registry - Standalone stack, independent of opencue stack.
#
# Context: OpenCue's cueweb and rest-gateway do not provide official images,
# while public cuebot images on Docker Hub lag significantly behind source code.
# Portainer stacks pull images from registries. See notes/deploy/01-server.md Section 6.
#
# Minimal viable configuration template. Production setups also require:
#   - TLS certificates (mandatory for non-localhost endpoints)
#   - Authentication (htpasswd or LDAP/SSO)
#   - Garbage collection scheduling (registry garbage-collect)
#   - Backups of registry-data volume

services:
  registry:
    image: registry:2
    container_name: opencue-registry
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped
    environment:
      # Enable manifest deletion for scheduled garbage-collect space reclamation
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  registry-data:
    name: opencue-registry-data
