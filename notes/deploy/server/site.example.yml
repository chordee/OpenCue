# Site-specific configuration override example. Copy to site.yml and overlay at deployment:
#   docker compose --env-file .env -f opencue.portainer.yml [-f build.yml] -f site.yml up -d
#
# Only needed when the Docker host cannot resolve render node short names via DNS.
# If the host resolves node short names, containers inherit search domains automatically,
# making this file unnecessary.
#
# Portainer does not support compose file overlays directly; paste these blocks into the Web editor if needed.

services:
  cuebot:
    # Option 1: Specify studio DNS and domain search suffix (Recommended for multiple nodes)
    dns:
      - 192.168.1.1
    dns_search:
      - studio.local

    # Option 2: Manually list nodes without DNS (Suitable only for small node counts)
    # Merges with extra_hosts in the main compose file.
    # extra_hosts:
    #   - "RENDER01:192.168.1.101"
    #   - "RENDER02:192.168.1.102"
