# OpenCue RQD config template (Windows render node)
#
# ASCII ONLY. RQD reads this file without specifying an encoding
# (rqconstants.py: config.read), so Python uses the system ANSI code page.
# On a standard Traditional Chinese Windows (cp950) any UTF-8 non-ASCII
# character makes RQD crash at startup with UnicodeDecodeError.
#
# Location: C:\opencue\rqd.conf (rqd-start.bat sets RQD_CONFIG_FILE)
# Chinese documentation: notes/deploy/02
#
# Defaults are for a DEDICATED RENDER NODE. On an artist workstation also
# change the two items marked EDIT (workstation).

[Override]
# EDIT: host name or IP of the OpenCue server
OVERRIDE_CUEBOT = opencue-server.studio.local

# EDIT: SHORT host name of this machine, not the FQDN.
# Cuebot calls back to port 8444 using this name, so it must resolve
# inside the Cuebot container.
OVERRIDE_HOSTNAME = RENDER01

# Must match the facility of submitted jobs (client default is "local").
# RQD defaults to "cloud"; without this line the node lands in cloud.general
# and never gets work (tested on Windows RQD).
DEFAULT_FACILITY = local

RQD_BECOME_JOB_USER = False
RQD_USE_PATH_ENV_VAR = 1
RQD_USE_IP_AS_HOSTNAME = 0

# EDIT (workstation): True on artist workstations
OVERRIDE_IS_DESKTOP = False

# Built-in keyboard/mouse NIMBY off. Workstations use the CueNIMBY schedule
# instead. The built-in detector installs a global input hook that EDR
# products often flag as a keylogger.
OVERRIDE_NIMBY = False

RQD_TMPDIR = C:\opencue\tmp
JOB_LOG_MAX_SIZE_IN_BYTES = 1073741824
RQD_PREPEND_TIMESTAMP = 0
CONSOLE_LOG_LEVEL = INFO

# EDIT: dispatch tags, space separated.
# EDIT (workstation): put "desktop" first.
#
# The FIRST tag also decides the allocation when the node registers for the
# first time (Cuebot takes the first tag that matches an allocation tag):
#   artist workstation   start with "desktop"  -> local.desktop
#   dedicated render     start with "general"  -> local.general
# This only happens on first registration. To change it later:
#   cueadmin -force -move <alloc> -host <name>
#
#   desktop                  artist workstation (see above)
#   general                  general pool
#   <app><major>             loose binding, e.g. houdini22
#   <app>_<full_version>     strict binding, e.g. houdini_22_0_429
# List only versions actually installed here, each with a wrapper in C:\opencue\bin.
# Tag matching is OR: a service/layer must not carry both "general" and a
# version tag, or version pinning is lost.
RQD_TAGS = general houdini22 houdini_22_0_429 maya2027 maya_2027 nuke17 nuke_17_0v1
