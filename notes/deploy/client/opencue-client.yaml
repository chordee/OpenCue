# OpenCue Client Configuration Template (Shared by pycue / cuegui / cuesubmit / cueadmin)
#
# Target Location:
#   Windows : %APPDATA%\opencue\opencue.yaml
#   Linux   : ~/.config/opencue/opencue.yaml
#   Or set environment variable OPENCUE_CONFIG_FILE to an arbitrary path
#
# Note: CueNIMBY does not read this file; it maintains its own cuenimby.json,
#       located at %USERPROFILE%\.config\opencue\ on Windows (not %APPDATA%).

cuebot.facility_default: local

cuebot.facility:
    local:
        # Replace with hostname or IP of the OpenCue server host
        - opencue-server.studio.local:8443

# Timeout and retries (inheriting default.yaml values, generally no change needed)
cuebot.timeout: 10000
cuebot.exception_retries: 3

logger.level: WARNING
