# Windows render node 的 RQD 設定（模擬 artist 工作站）
#
# 放置位置：%LOCALAPPDATA%\OpenCue\rqd.conf
# 或用 RQD_CONFIG_FILE 環境變數 / -c 參數指定。

[Override]
# Cuebot 的位置。Docker stack 把 8443 publish 到宿主，所以從 Windows 看就是 localhost。
# 正式環境改成那台 Linux 主機的 hostname 或 IP。
OVERRIDE_CUEBOT = localhost

# 回報給 Cuebot 的主機名稱。
# 【關鍵】Cuebot 會用這個名稱「回連」本機的 8444，所以它必須是
# 「Cuebot 那端解析得到、且路由得到」的名稱，不是本機自己看得懂就好。
# 本次測試 Cuebot 跑在 Docker Desktop 容器內，容器要連回 Windows 宿主
# 要用 host.docker.internal 才連得到；但 Cuebot 會把 FQDN 截成第一段（變成 "host"），
# 那個名稱在容器內解析不到。因此改用單段的實際主機名稱，並在 cuebot 服務加上
# extra_hosts 指向 host-gateway —— 這正好對應真實環境「DNS 把節點名稱解析到其 IP」。
# 正式環境：Windows 節點與 Linux 主機在同一個網段，這裡應填該節點在
# 公司 DNS 上的實際主機名稱（或直接用 IP）。
OVERRIDE_HOSTNAME = LAPTOP-ULJICLO8

# Windows 上不做 job user 切換（該功能需要 root，且 Rust RQD 在 Windows 尚未支援）
RQD_BECOME_JOB_USER = False

# 用 PATH 環境變數尋找算圖程式
RQD_USE_PATH_ENV_VAR = 1

# 不要用 IP 當主機名稱（見 notes 04 的坑 #3）
RQD_USE_IP_AS_HOSTNAME = 0

# 標記為工作站而非專職 render node
OVERRIDE_IS_DESKTOP = True

# NIMBY：有人在用電腦時不搶資源。
# 第一階段測試先關掉，確認 frame 能正常執行；之後再打開驗證工作站行為。
OVERRIDE_NIMBY = False

# 閒置多久才開始算圖（NIMBY 開啟時生效）
CHECK_INTERVAL_LOCKED = 60
MINIMUM_IDLE = 900

RQD_TMPDIR = C:\tmp\rqd
JOB_LOG_MAX_SIZE_IN_BYTES = 1073741824
RQD_PREPEND_TIMESTAMP = 0

CONSOLE_LOG_LEVEL = INFO

# 派工標籤。
# 【重要】Cuebot 依「layer 的 tags」與「host 的 tags」做匹配。
# pyoutline 送出的 job，其 layer 預設 tags 是 "general | util"。
# 若把工作站移進 local.desktop allocation，host 只會帶到 desktop 標籤，
# 對不上 general → 永遠不會被派工。
#
# 「下班後借用工作站」的情境，工作站要留在一般派工池裡（差別只在時段可用性），
# 所以這裡補回 general。
#
# 若改成「工作站只跑特定類型的工作」，則不要加 general，
# 改為在投 job 時指定 desktop 標籤。
# 以空白分隔（rqmachine.py:599 是 .split()）。
#
# 除了派工池的 general 之外，這裡也廣告本機「裝了哪些 DCC 版本」。
# 正式環境不同機器會裝不同版本，job 投遞時用對應的 layer tag，
# Cuebot 就只會把工作派給真的能跑的節點。
#
# 命名慣例建議：<軟體><主版本> 與 <軟體>_<完整版本> 兩種都給，
# 讓專案可以選擇鬆綁定（houdini22）或嚴格綁定（houdini_22_0_429）。
RQD_TAGS = general houdini22 houdini_22_0_429 maya2027 maya_2027 nuke17 nuke_17_0v1
