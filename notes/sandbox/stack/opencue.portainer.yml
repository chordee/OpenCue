# OpenCue — Portainer stack（正式環境型態）
#
# 與 repo 根目錄的 docker-compose.yml 的差別：
#   1. 完全不用 build:，只用 image: —— Portainer 部署 stack 時沒有 build context
#   2. 不含 rqd —— 宿主不參與算圖，render node 是外部的 Windows 機器
#   3. PostgreSQL 不對外 publish —— 宿主上還有其他服務，避免 port 衝突與曝險
#   4. 所有可變參數走環境變數，由 Portainer 的 stack 環境變數提供
#   5. 明確命名 network，避免與宿主其他 stack 混淆
#   6. 加上資源上限，避免吃掉其他服務的資源
#
# 需要的環境變數見同目錄的 env.example。

services:
  db:
    image: postgres:15.1
    container_name: opencue-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - opencue
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  flyway:
    image: ${OPENCUE_FLYWAY_IMAGE}
    container_name: opencue-flyway
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: db
      PGPORT: 5432
    command: /opt/scripts/migrate.sh
    networks:
      - opencue
    restart: "no"

  cuebot:
    image: ${OPENCUE_CUEBOT_IMAGE}
    container_name: opencue-cuebot
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    ports:
      - "${CUEBOT_GRPC_PORT}:8443"
    environment:
      # 注意：這是 frame log 的「根目錄」，實際建目錄與寫檔的是各台 render node 上
      # 的 RQD，不是 Cuebot。Cuebot 本身不掛這個路徑、也不寫入。
      # 因此這個值必須是「所有 render node 都寫得到的同一位置」。
      # Windows render node 的情況需填 UNC 路徑或一致的磁碟機代號。
      CUE_FRAME_LOG_DIR: ${CUE_FRAME_LOG_DIR}
    command: >-
      --datasource.cue-data-source.jdbc-url=jdbc:postgresql://db/${POSTGRES_DB}
      --datasource.cue-data-source.username=${POSTGRES_USER}
      --datasource.cue-data-source.password=${POSTGRES_PASSWORD}
    # 【規模化的正解】讓容器使用公司 DNS 與網域搜尋後綴，
    # 如此 Cuebot 解析短名稱 RENDER01 時會自動查 RENDER01.studio.local，
    # 完全不需要維護 extra_hosts。節點數量一多，extra_hosts 就不可行。
    #
    # 正式環境請取消以下兩段的註解並填入實際值，同時移除下方的 extra_hosts。
    # 本機測試環境沒有公司 DNS 可驗證，因此預設維持註解狀態 —— 未經實測的設定
    # 不放進預設值。
    #
    # dns:
    #   - 192.168.1.1          # 公司內部 DNS 伺服器
    # dns_search:
    #   - studio.local         # 網域名稱後綴
    # 沒有可用 DNS 時的退路：逐台硬寫。僅適用於少量節點的測試。
    # Cuebot 會把 RQD 回報的名稱截成第一段（FQDN 的第一個 label），再用它回連 8444，
    # 所以那個短名稱必須在「Cuebot 容器內」解析得到。
    # 正式環境若公司 DNS 能解析節點短名稱，這段可以不需要；否則就在這裡逐一列出。
    extra_hosts:
      - "${RENDER_NODE_NAME}:${RENDER_NODE_ADDR}"
    networks:
      - opencue
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || [ $$? -eq 22 ]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G

  # ---------------------------------------------------------------------------
  # REST Gateway：把 Cuebot 的 gRPC 包成 HTTP/JSON，供 CueWeb 使用。
  # 刻意不 publish 到宿主 —— 只有同一個 network 上的 CueWeb 需要它。
  # 若 pipeline 要直接呼叫 REST API，再自行加上 ports 並置於反向代理後。
  # ---------------------------------------------------------------------------
  rest-gateway:
    image: ${OPENCUE_REST_GATEWAY_IMAGE}
    container_name: opencue-rest-gateway
    depends_on:
      cuebot:
        condition: service_healthy
    environment:
      CUEBOT_ENDPOINT: cuebot:8443
      JWT_SECRET: ${JWT_SECRET}
      REST_PORT: 8448
      LOG_LEVEL: info
    networks:
      - opencue
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8448/ || [ $$? -eq 22 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # CueWeb：網頁版監控介面。
  #
  # 關於 NEXT_PUBLIC_* 的 build-time 問題：Next.js 會把這些變數烘進 image。
  # 但官方設定把 NEXT_PUBLIC_URL 留空，意思是「瀏覽器用同源相對路徑打 CueWeb
  # 自己的 /api」，再由 Next.js 伺服器端去呼叫 rest-gateway:8448。
  # 因此 rest-gateway 這個容器名稱只在伺服器端使用，瀏覽器不需要解析它 ——
  # 換部署位置不必重建 image。若把 NEXT_PUBLIC_URL 設成絕對網址就會重新引入
  # 這個問題。
  # ---------------------------------------------------------------------------
  cueweb:
    image: ${OPENCUE_CUEWEB_IMAGE}
    container_name: opencue-cueweb
    depends_on:
      rest-gateway:
        condition: service_healthy
    ports:
      - "${CUEWEB_PORT}:3000"
    environment:
      NEXT_PUBLIC_OPENCUE_ENDPOINT: http://rest-gateway:8448
      NEXT_PUBLIC_URL: ""
      NEXT_PUBLIC_AUTH_PROVIDER: ""
      NEXT_JWT_SECRET: ${JWT_SECRET}
      NEXTAUTH_URL: ${CUEWEB_PUBLIC_URL}
      NEXTAUTH_SECRET: ${CUEWEB_NEXTAUTH_SECRET}
      SENTRY_ENVIRONMENT: production
      # 兩個白名單負責不同的端點，用途不可混淆：
      #
      # CUEWEB_LOG_ROOTS    -> /api/getlog 與 stuck-frames/lastline
      #                        讀取 frame 的文字 log (.rqlog)
      #                        未設定時「不限制」，只要是容器內的絕對路徑就讀得到
      #                        設定它是為了限縮讀取範圍，屬於安全強化
      #
      # CUEWEB_PREVIEW_ROOTS -> /api/frame/preview
      #                        顯示算圖成果的圖片縮圖
      #                        未設定時「一律拒絕」（403），屬於 fail-closed
      #                        應指向算圖輸出目錄，不是 log 目錄
      #
      # 註：官方 sandbox 把 PREVIEW_ROOTS 指向 log 目錄，是因為它的 Blender
      #     demo 刻意把圖寫進 log 目錄。正式環境算圖輸出是獨立的共享。
      CUEWEB_LOG_ROOTS: ${CUEWEB_LOG_ROOTS}
      CUEWEB_PREVIEW_ROOTS: ${CUEWEB_PREVIEW_ROOTS}
    volumes:
      # CueWeb 要能讀到 frame log 才顯示得出來。
      # 【注意】Cuebot 記錄的 log 路徑是「render node 寫入時的路徑」。
      # render node 是 Windows 時，那會是 Windows 路徑，Linux 容器內不存在。
      # 詳見 notes/sandbox/13。
      - ${FRAME_LOG_MOUNT_SOURCE}:${FRAME_LOG_MOUNT_TARGET}:ro
      # 算圖輸出。要在網頁上看縮圖預覽才需要，可留空不掛。
      - ${RENDER_OUT_MOUNT_SOURCE}:${RENDER_OUT_MOUNT_TARGET}:ro
    networks:
      - opencue
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  opencue:
    name: opencue

volumes:
  db-data:
    name: opencue-db-data
