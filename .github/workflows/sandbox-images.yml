# 把 notes/deploy/server 用到的五個自建 image build 好推到 GHCR。
# 手動觸發：Actions → Sandbox images → Run workflow。
# 產出 ghcr.io/<owner>/opencue/<name>:<上游版本>-<短 SHA>，另外標一個 latest。
# 說明見 notes/deploy/04-operations.md 第一節。

name: Sandbox images

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 這個分支合併的上游 release 版本，例如 1.34.22
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        env:
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        run: |
          # <上游版本>-<短 SHA>，例如 1.34.22-e79848a8
          # 不用 ci/generate_version_number.py：它在非 master 分支會算成「下一個 patch」，
          # 數字也取決於 fork 的 master 有沒有跟上上游
          if ! [[ "$UPSTREAM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "upstream_version must look like 1.34.22, got '$UPSTREAM_VERSION'" >&2
            exit 1
          fi
          TAG=$UPSTREAM_VERSION-$(git rev-parse --short=8 HEAD)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REG=ghcr.io/$OWNER/opencue
          {
            echo "TAG=$TAG"
            echo "REG=$REG"
            # 給 init 裡的 pip 套件用，PEP 440 只接受 1.34.22+e79848a8 這種寫法
            echo "OPENCUE_VERSION=${TAG/-/+}"
            echo "OPENCUE_CUEBOT_IMAGE=$REG/cuebot:$TAG"
            echo "OPENCUE_FLYWAY_IMAGE=$REG/flyway:$TAG"
            echo "OPENCUE_REST_GATEWAY_IMAGE=$REG/rest-gateway:$TAG"
            echo "OPENCUE_CUEWEB_IMAGE=$REG/cueweb:$TAG"
            echo "OPENCUE_INIT_IMAGE=$REG/init:$TAG"
            # 主檔的必填項，build 時用不到，給占位值通過檢查
            echo "POSTGRES_PASSWORD=unused"
            echo "JWT_SECRET=unused"
            echo "CUEWEB_NEXTAUTH_SECRET=unused"
            echo "CUE_FRAME_LOG_DIR=unused"
          } >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        working-directory: notes/deploy/server
        run: docker compose -f opencue.portainer.yml -f build.yml build flyway cuebot rest-gateway cueweb init

      - name: Push
        working-directory: notes/deploy/server
        run: |
          docker compose -f opencue.portainer.yml -f build.yml push flyway cuebot rest-gateway cueweb init
          for n in flyway cuebot rest-gateway cueweb init; do
            docker tag "$REG/$n:$TAG" "$REG/$n:latest"
            docker push "$REG/$n:latest"
          done

      - name: Summary
        run: |
          {
            echo "### 已推送 \`$TAG\`"
            echo '```'
            for n in cuebot flyway rest-gateway cueweb init; do echo "$REG/$n:$TAG"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
